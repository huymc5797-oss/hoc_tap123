<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz kiến thức · Studyverse</title><link rel="stylesheet" href="css/style.css"></head><body data-page="quiz"><div id="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><section class="page-content"><div class="page-heading"><div><div class="eyebrow">STUDYVERSE / WORKSPACE</div><h1>Quiz kiến thức</h1><p class="muted">Kiểm tra nhanh mức độ hiểu bài và xem lại lời giải sau khi hoàn thành.</p></div></div>
<div id="quiz-list-view"><div class="filter-pills" id="quiz-filters"><button class="filter-pill active" data-filter="all">Tất cả</button><button class="filter-pill" data-filter="Tin học">Tin học</button><button class="filter-pill" data-filter="Tiếng Anh">Tiếng Anh</button><button class="filter-pill" data-filter="Vật lý">Vật lý</button></div><div id="quiz-grid" class="quiz-grid"></div></div>
<section id="quiz-run-view" class="panel quiz-run hidden"><div class="quiz-top"><span class="tag" id="quiz-subject">Tin học</span><span id="quiz-progress-label" class="muted">Câu 1/5</span><span id="quiz-timer" class="timer-chip">∞ Không giới hạn</span></div><div class="progress"><span id="quiz-progress-bar" style="width:0%"></span></div><h2 id="quiz-question" class="question-title"></h2><div id="quiz-options" class="quiz-options"></div><div class="quiz-actions"><button id="quiz-exit" class="button button-secondary">← Thoát</button><button id="quiz-next" class="button button-primary">Câu tiếp theo →</button></div></section>
<section id="quiz-result-view" class="panel result-panel hidden"><div class="result-symbol">✦</div><div class="eyebrow">KẾT QUẢ CỦA BẠN</div><h2 id="quiz-result-title">Hoàn thành Quiz!</h2><div class="result-score" id="quiz-score">0%</div><p id="quiz-result-detail" class="muted"></p><div id="quiz-review" class="review-list"></div><div class="button-row"><button id="quiz-retry" class="button button-primary">Làm lại</button><button id="quiz-back" class="button button-secondary">Danh sách Quiz</button></div></section>
</section></main></div><div id="toast-root" class="toast-root"></div><script src="js/app.js"></script><script src="js/pages.js"></script></body></html>
