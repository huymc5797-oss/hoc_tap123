<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flashcard · Studyverse</title><link rel="stylesheet" href="css/style.css"></head><body data-page="flashcard"><div id="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><section class="page-content"><div class="page-heading"><div><div class="eyebrow">STUDYVERSE / WORKSPACE</div><h1>Flashcard</h1><p class="muted">Ghi nhớ chủ động bằng cách tự trả lời trước khi lật thẻ.</p></div></div>
<div class="toolbar"><select id="deck-select" class="select-input"><option value="web">Web Fundamentals</option><option value="english">English Vocabulary</option><option value="physics">Vật lý cơ bản</option></select><button id="shuffle-cards" class="button button-secondary">⇄ Trộn thẻ</button><button id="reset-cards" class="button button-secondary">↺ Học lại</button></div>
<div class="flash-layout"><section class="flash-main"><div class="flash-meta"><span id="flash-counter">Thẻ 1 / 8</span><span class="tag">Chạm thẻ để lật</span></div><button id="flashcard" class="flashcard" aria-label="Lật flashcard"><span class="flash-label" id="flash-label">CÂU HỎI</span><span class="flash-question" id="flash-question"></span><span class="flash-hint">Nhấn để xem đáp án ↻</span></button><div class="progress flash-progress"><span id="flash-progress-bar" style="width:0%"></span></div><div class="flash-controls"><button class="button button-secondary" id="flash-prev">← Trước</button><button class="button button-secondary" id="flash-next">Tiếp theo →</button></div><div class="rating-row"><button class="rating-button no" data-rating="again">↻ Chưa nhớ</button><button class="rating-button hard" data-rating="hard">△ Khó</button><button class="rating-button good" data-rating="good">✓ Đã nhớ</button><button class="rating-button easy" data-rating="easy">✦ Rất dễ</button></div></section><aside class="panel flash-side"><h2>Tiến độ bộ thẻ</h2><div class="focus-number" id="flash-learned">0</div><p class="muted">thẻ đã đánh giá trong lượt này</p><div class="divider"></div><div class="mini-stat"><span>Tổng số thẻ</span><strong id="flash-total">8</strong></div><p class="small muted">Mẹo: hãy cố gắng trả lời thành tiếng trước khi lật thẻ để tăng khả năng ghi nhớ.</p></aside></div>
</section></main></div><div id="toast-root" class="toast-root"></div><script src="js/app.js"></script><script src="js/pages.js"></script></body></html>
