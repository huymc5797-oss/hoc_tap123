<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - STUDYVERSE</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="brand-logo" style="margin: 0 auto 1rem;">S</div>
      <h2>Đăng nhập STUDYVERSE</h2>
      <p style="color: var(--text-sub); font-size: var(--font-size-sm);">Chào mừng bạn quay trở lại</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Tên tài khoản</label>
        <input type="text" id="login-username" placeholder="Nhập tên tài khoản..." required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Đăng nhập</button>
    </form>

    <div class="auth-footer">
      Chưa có tài khoản? <a href="./dang-ky.html">Đăng ký ngay</a>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
